name: Flutter Android CI + Upload to Google Drive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: "stable"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    outputs:
      apk_url: ${{ steps.set_output.outputs.apk_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y unzip curl jq git xz-utils python3 python3-pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Android SDK commandline tools
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p "${ANDROID_SDK_ROOT}"
          cd "${ANDROID_SDK_ROOT}"
          CLI_ZIP="commandlinetools-linux-9123335_latest.zip"
          if [ ! -f "${CLI_ZIP}" ]; then
            curl -fsSL -o ${CLI_ZIP} https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip
          fi
          mkdir -p cmdline-tools
          unzip -q -o ${CLI_ZIP} -d cmdline-tools
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Add Android SDK to PATH
        run: echo "${{ env.ANDROID_SDK_ROOT }}/platform-tools:${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter -- version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Build release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK as workflow artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Install Python Drive client libs
        run: pip3 install google-auth google-auth-httplib2 google-api-python-client

      - name: Create service-account.json from secret
        run: |
          printf '%s' "${{ secrets.GDRIVE_SERVICE_ACCOUNT }}" > service-account.json
          ls -la service-account.json

      - name: Upload APK to Google Drive (writes apk_url.txt)
        run: |
          set -e
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH" && exit 1
          fi

          python3 <<'PY'
import os, json
from google.oauth2 import service_account
from googleapiclient.discovery import build
from googleapiclient.http import MediaFileUpload

SERVICE_ACCOUNT_FILE = "service-account.json"
FOLDER_ID = os.environ.get("GDRIVE_FOLDER_ID")
APK_FILE = "build/app/outputs/flutter-apk/app-release.apk"

creds = service_account.Credentials.from_service_account_file(
    SERVICE_ACCOUNT_FILE,
    scopes=["https://www.googleapis.com/auth/drive"]
)

service = build("drive", "v3", credentials=creds)

file_metadata = {
    "name": os.path.basename(APK_FILE),
    "parents": [FOLDER_ID]
}

media = MediaFileUpload(APK_FILE, mimetype="application/vnd.android.package-archive")

file = service.files().create(
    body=file_metadata,
    media_body=media,
    fields="id"
).execute()

file_id = file.get("id")

# Make file public (anyone with link can read)
service.permissions().create(
    fileId=file_id,
    body={"role": "reader", "type": "anyone"}
).execute()

download_url = f"https://drive.google.com/uc?id={file_id}&export=download"

# Save to a file so we can read from shell
with open("apk_url.txt", "w") as fh:
    fh.write(download_url)

print("UPLOAD_DONE:", download_url)
PY
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      - name: Set workflow output (apk_url)
        id: set_output
        run: |
          if [ -f apk_url.txt ]; then
            APK_URL=$(cat apk_url.txt)
            echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
            echo "APK URL set to: $APK_URL"
          else
            echo "apk_url file not found" && exit 1
          fi

      - name: Print final download link
        run: echo "Download URL: ${{ steps.set_output.outputs.apk_url }}"
